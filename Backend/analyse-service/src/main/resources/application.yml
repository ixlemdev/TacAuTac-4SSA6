# MS-IA analyse-service : configuration locale.
# Les valeurs ${VAR:defaut} sont lues depuis l'environnement (Docker) ; sinon la valeur par défaut sert en local.
server:
  port: 8087

spring:
  application:
    name: analyse-service
  config:
    # "optional:" : le service démarre même si le Config Server n'est pas lancé
    import: "optional:configserver:${CONFIG_SERVER_URL:http://localhost:8888}"
  data:
    mongodb:
      uri: ${MONGODB_URI:mongodb://localhost:27017/tacautac_analyse}

eureka:
  client:
    enabled: ${EUREKA_ENABLED:true}   # EUREKA_ENABLED=false pour lancer le service seul
    service-url:
      defaultZone: ${EUREKA_URL:http://localhost:8761/eureka}
  instance:
    prefer-ip-address: true

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html

management:
  endpoints:
    web:
      exposure:
        include: health,info

tacautac:
  moteur-ia:
    url: ${MOTEUR_IA_URL:http://localhost:8000}   # moteur Python, hors Eureka
