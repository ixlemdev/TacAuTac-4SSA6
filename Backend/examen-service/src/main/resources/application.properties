spring.application.name=examen-service

spring.datasource.url=jdbc:mysql://localhost:3306/tacautac_examen?useSSL=false&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

spring.kafka.listener.auto-startup=false

server.port=8084

# Client Eureka (atelier Eureka, partie 2)
# EUREKA_ENABLED=false pour lancer le service seul, sans Eureka
eureka.client.enabled=${EUREKA_ENABLED:true}
# s'inscrire dans l'annuaire Eureka
eureka.client.register-with-eureka=true
# telecharger l'annuaire pour trouver les autres services par leur nom
eureka.client.fetch-registry=true
# adresse du serveur Eureka ; EUREKA_URL la remplace sous Docker
eureka.client.service-url.defaultZone=${EUREKA_URL:http://localhost:8761/eureka}
# s'inscrire avec l'adresse IP plutot qu'avec le nom de la machine
eureka.instance.prefer-ip-address=true

# Actuator : endpoints exposes (seul health l'est par defaut)
management.endpoints.web.exposure.include=health,info,metrics
# detail des composants dans /actuator/health (db, diskSpace, ping...)
management.endpoint.health.show-details=always
# envoyer a Eureka le vrai statut de /actuator/health (DOWN si la base tombe)
eureka.client.healthcheck.enabled=true
# publier les proprietes info.* dans /actuator/info
management.info.env.enabled=true
info.app.name=examen-service
info.app.version=1.0.0
info.app.description=MS4 : simulation d'epreuve et attestation
info.app.team=Tac au Tac