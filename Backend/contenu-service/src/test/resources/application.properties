# Tests : base H2 en memoire, sans Eureka ni Config Server (MySQL n'a pas besoin d'etre lance)
spring.application.name=contenu-service
spring.cloud.config.enabled=false
spring.cloud.config.import-check.enabled=false
spring.datasource.url=jdbc:h2:mem:contenu_test;MODE=MySQL;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=create-drop
eureka.client.enabled=false
