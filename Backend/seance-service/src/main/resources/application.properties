# MS3 seance-service : configuration locale.
# Les valeurs ${VAR:defaut} sont lues depuis l'environnement (Docker) ; sinon la valeur par defaut sert en local.
server.port=8083

# erreurs au format ProblemDetail (RFC 7807)
spring.mvc.problemdetails.enabled=true
spring.application.name=seance-service
# "optional:" : le service demarre meme si le Config Server n'est pas lance
spring.config.import=optional:configserver:${CONFIG_SERVER_URL:http://localhost:8888}
spring.datasource.url=jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/tacautac_seance?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.show-sql=false
# au-dela : 413 Payload Too Large
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=6MB

# Client Eureka (atelier Eureka, partie 2)
# EUREKA_ENABLED=false pour lancer le service seul, sans Eureka
eureka.client.enabled=${EUREKA_ENABLED:true}
# s'inscrire dans l'annuaire Eureka
eureka.client.register-with-eureka=true
# telecharger l'annuaire pour trouver les autres services par leur nom
eureka.client.fetch-registry=true
# adresse du serveur Eureka ; EUREKA_URL la remplace sous Docker
eureka.client.service-url.defaultZone=${EUREKA_URL:http://localhost:8761/eureka}
# s'inscrire avec l'adresse IP plutot qu'avec le nom de la machine
eureka.instance.prefer-ip-address=true

springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html

management.endpoints.web.exposure.include=health,info

tacautac.stockage.dossier-audio=${AUDIO_DIR:./uploads/audio}
tacautac.stockage.duree-max-sec=60
