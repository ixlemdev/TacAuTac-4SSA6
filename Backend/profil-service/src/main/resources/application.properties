spring.application.name=profil-service

# Config Server (optionnel : le service demarre meme s'il est absent)
spring.config.import=optional:configserver:${CONFIG_SERVER_URL:http://localhost:8888}

# MySQL : root sans mot de passe en local (XAMPP) ; profil_user sous Docker (Backend/mysql-init/01-profil.sql)
spring.datasource.url=jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/tacautac_profil?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.format_sql=true

spring.mvc.problemdetails.enabled=true

spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP:localhost:9092}
spring.kafka.consumer.group-id=profil-service
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.apache.kafka.common.serialization.StringDeserializer

spring.security.oauth2.resourceserver.jwt.issuer-uri=${KEYCLOAK_ISSUER:http://localhost:8180/realms/tacautac}

server.port=8081

# Client Eureka (atelier Eureka, partie 2)
# EUREKA_ENABLED=false pour lancer le service seul, sans Eureka
eureka.client.enabled=${EUREKA_ENABLED:true}
# s'inscrire dans l'annuaire Eureka
eureka.client.register-with-eureka=true
# telecharger l'annuaire pour trouver les autres services par leur nom
eureka.client.fetch-registry=true
# adresse du serveur Eureka ; EUREKA_URL la remplace sous Docker
eureka.client.service-url.defaultZone=${EUREKA_URL:http://localhost:8761/eureka}
# s'inscrire avec l'adresse IP plutot qu'avec le nom de la machine
eureka.instance.prefer-ip-address=true

springdoc.swagger-ui.path=/swagger-ui.html

# false tant que Keycloak n'est pas branche (S8) ; true ensuite
app.security.enabled=${SECURITY_ENABLED:false}
app.kafka.topic-niveau-estime=niveau.estime.maj
app.seed.enabled=${SEED_ENABLED:true}

# Actuator : endpoints exposes (seul health l'est par defaut)
management.endpoints.web.exposure.include=health,info,metrics
# detail des composants dans /actuator/health (db, diskSpace, ping...)
management.endpoint.health.show-details=always
# envoyer a Eureka le vrai statut de /actuator/health (DOWN si la base tombe)
eureka.client.healthcheck.enabled=true
# publier les proprietes info.* dans /actuator/info
management.info.env.enabled=true
info.app.name=profil-service
info.app.version=1.0.0
info.app.description=MS1 : profils, consentement vocal, groupes et etablissements
info.app.team=Tac au Tac
