# MS2 contenu-service : configuration locale.
# Les valeurs ${VAR:defaut} sont lues depuis l'environnement (Docker) ; sinon la valeur par defaut sert en local.
server.port=8082

spring.application.name=contenu-service
# "optional:" : le service demarre meme si le Config Server n'est pas lance
spring.config.import=optional:configserver:${CONFIG_SERVER_URL:http://localhost:8888}
# Base H2 en mode fichier : embarquee dans le service, donnees dans ${H2_DIR}/tacautac_contenu.mv.db
spring.datasource.url=jdbc:h2:file:${H2_DIR:./data}/tacautac_contenu;MODE=MySQL;DATABASE_TO_LOWER=TRUE
spring.datasource.username=${DB_USERNAME:sa}
spring.datasource.password=${DB_PASSWORD:}
# console web H2 pour la demonstration : http://localhost:8082/h2-console
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.show-sql=false

# Client Eureka (atelier Eureka, partie 2)
# EUREKA_ENABLED=false pour lancer le service seul, sans Eureka
eureka.client.enabled=${EUREKA_ENABLED:true}
# s'inscrire dans l'annuaire Eureka
eureka.client.register-with-eureka=true
# telecharger l'annuaire pour trouver les autres services par leur nom
eureka.client.fetch-registry=true
# adresse du serveur Eureka ; EUREKA_URL la remplace sous Docker
eureka.client.service-url.defaultZone=${EUREKA_URL:http://localhost:8761/eureka}
# s'inscrire avec l'adresse IP plutot qu'avec le nom de la machine
eureka.instance.prefer-ip-address=true

springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html

# Actuator : endpoints exposes (seul health l'est par defaut)
management.endpoints.web.exposure.include=health,info,metrics
# detail des composants dans /actuator/health (db, diskSpace, ping...)
management.endpoint.health.show-details=always
# envoyer a Eureka le vrai statut de /actuator/health (DOWN si la base tombe)
eureka.client.healthcheck.enabled=true
# publier les proprietes info.* dans /actuator/info
management.info.env.enabled=true
info.app.name=contenu-service
info.app.version=1.0.0
info.app.description=MS2 : catalogue pedagogique (sujets, parcours, exercices)
info.app.team=Tac au Tac
