# Profil "h2" : base en memoire, pour lancer le service sans MySQL (SPRING_PROFILES_ACTIVE=h2).
# Les donnees de demonstration sont rechargees a chaque demarrage.
spring.datasource.url=jdbc:h2:mem:tacautac_seance;MODE=MySQL;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=create-drop
