
spring:
  application:
    name: examen-service

  datasource:
    url: jdbc:mysql://localhost:3306/tacautac_examen?useSSL=false&serverTimezone=UTC
    username: root
    password: ${DB_PASSWORD:}
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true

  cloud:
    discovery:
      enabled: false

  kafka:
    listener:
      auto-startup: false

server:
  port: 8084

eureka:
  client:
    enabled: false

management:
  endpoints:
    web:
      exposure:
        include: health,info
