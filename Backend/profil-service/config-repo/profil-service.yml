# À copier dans Backend/config-repo/profil-service.yml (servi par le Config Server)
server:
  port: 8081

spring:
  datasource:
    url: jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/tacautac_profil?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:}

app:
  kafka:
    topic-niveau-estime: niveau.estime.maj
